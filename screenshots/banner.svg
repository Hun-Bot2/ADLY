<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <!-- ALDY README banner (source of banner.png via rsvg-convert). One headline, one visual, equal margins; Tableau blue accent. -->
  <defs>
    <linearGradient id="icon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a86b4"/><stop offset="1" stop-color="#3d6188"/></linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1f3b5c" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1600" height="480" rx="28" fill="#f3f6fa"/>
  <g id="left" transform="translate(0 111)" font-family="Apple SD Gothic Neo, Helvetica Neue, sans-serif">
    <text id="eyebrow" x="140" y="26" font-size="26" font-weight="700" fill="#4e79a7" letter-spacing=".5">ALDY · Algorithm Daily</text>
    <text id="headline" x="136" y="118" font-size="68" font-weight="700" fill="#191f28" letter-spacing="-1">매일 풀 문제를, 내 기록으로.</text>
    <text id="sub" x="140" y="174" font-size="28" font-weight="500" fill="#4e5968">풀이 기록을 읽어 오늘의 문제와 복습을 계획하는 로컬 학습 앱</text>
    <g id="chips" transform="translate(0 210)" font-size="22" font-weight="600" fill="#4e5968">
      <rect x="140" y="0" width="128" height="44" rx="22" fill="#fff" stroke="#e5e8eb"/><text x="204" y="29" text-anchor="middle">LeetCode</text>
      <rect x="280" y="0" width="150" height="44" rx="22" fill="#fff" stroke="#e5e8eb"/><text x="355" y="29" text-anchor="middle">Codeforces</text>
      <rect x="442" y="0" width="118" height="44" rx="22" fill="#fff" stroke="#e5e8eb"/><text x="501" y="29" text-anchor="middle">AtCoder</text>
      <rect x="572" y="0" width="108" height="44" rx="22" fill="#e9eff6"/><text x="626" y="29" text-anchor="middle" fill="#3d6188">macOS</text>
    </g>
  </g>
  <g filter="url(#lift)" transform="translate(1200 110)">
    <g transform="scale(0.3155) translate(-100 -100)">
      <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#icon)"/>
      <path d="M318 742 L512 268 L706 742" fill="none" stroke="#fff" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M392 598 L470 672 L640 500" fill="none" stroke="#edc948" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
