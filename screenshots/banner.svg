<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <!-- ALDY README banner. Source of screenshots/banner.png (rsvg-convert); colours are Tableau 10 like the app. -->
  <defs>
    <linearGradient id="icon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a86b4"/><stop offset="1" stop-color="#3d6188"/></linearGradient>
